# Fault injection experiment design for WESAD CCP check validation.
# Pre-registered 2026-10-28 -- before any experiment is run.
# Harness: src/experiments/fault_injection.py
# Results (when run): reports/experiments/fault_injection_results.json
#
# Purpose: WESAD bronze data is exceptionally clean (zero missingness, zero
# conformance violations across all 15 participants). This makes it impossible
# to assess whether the CCP checks would catch real problems. These experiments
# inject known faults into copies of three participants' data and measure whether
# each check detects them. All faults are injected into copies in
# experiments/scratch/; no bronze file is ever modified.
#
# Pre-registration rationale: expectations are stated here before any run so
# that the results can be evaluated against a prior commitment, not reverse-
# engineered from outcomes.

metadata:
  status: pre_registered
  date_pre_registered: "2026-10-28"
  date_amended: "2026-10-28"
  amendment_summary: >
    Amended before any experiment run: (1) inject into cleaned state (Silver
    TEMP + Bronze); (2) add control condition; (3) add verdict_level per_signal;
    (4) replace E4 OOR conformance fault with sampling-rate fault; (5) add
    e4_bounds_overlap_note; (6) update TEMP plausibility expectations.
  harness: src/experiments/fault_injection.py
  note: >
    This file must not be modified after the first experiment run. Any change
    after running constitutes post-hoc revision of a pre-registered design.

injection_source:
  description: >
    Each participant's scratch directory uses Silver TEMP (warm-up indices 0-3
    already replaced with NaN) plus Bronze for all other signals. This matches
    the state that src/checks/post_cleaning.py operates on. Documented
    intentional removals (indices 0-3 per participant, from
    reports/wesad_cleaning.json) are excluded from the completeness missingness
    rate exactly as in the post-cleaning checks.
  silver_temp_path_pattern: "silver/WESAD/{pid}/{pid}_E4_Data/TEMP.csv"
  bronze_other_signals: true
  intentional_removals_source: "reports/wesad_cleaning.json"

# ---------------------------------------------------------------------------
# Participants
# ---------------------------------------------------------------------------

participants:
  fixed: [S2, S8, S15]
  rationale: >
    Three participants cover the range of recorded session lengths and include
    both documented anomaly cases (S2 has a RespiBAN TEMP attachment note) and
    a standard participant (S15). The set is fixed before any run.

# ---------------------------------------------------------------------------
# Fault types
# ---------------------------------------------------------------------------
# For each fault type: which signals are targeted and why.
#
# Target signals overall: E4 TEMP, E4 EDA, E4 HR, RespiBAN ECG.
# Rationale for signal selection:
#   E4 TEMP -- the only signal cleaned in the Silver layer; experiments inject
#              into the cleaned state (Silver NaN at indices 0-3), so no
#              pre-existing violations exist when the checks are run.
#   E4 EDA  -- device-capacity breach classification (above_max = device_capacity
#              rather than physiological_implausible); demonstrates cross-check
#              between conformance and plausibility.
#   E4 HR   -- lowest sample rate among E4 fixed-rate signals (1 Hz); tests
#              threshold behaviour at small absolute fault counts.
#   RespiBAN ECG -- the RespiBAN completeness check uses nSeq sequence gaps
#              rather than per-channel NaN, so ECG faults exercise a different
#              detection mechanism. Conformance checks ADC range [0, 65535]
#              independently of the plausibility physical-unit bound, so ECG
#              tests the ADC-range vs transfer-function cross-check.

fault_types:

  completeness_scattered_nan:
    description: >
      Scattered single-sample NaN values injected at randomly chosen
      (non-contiguous) positions.
    target_signals:
      - E4/TEMP
      - E4/EDA
      - E4/HR
      - RespiBAN/ECG
    target_check: completeness
    implementation_notes:
      E4_signals: >
        Replace selected data rows with "nan". Positions chosen uniformly at
        random without replacement. For E4/TEMP: exclude indices 0-3 from
        injection because Silver TEMP already has NaN at those positions;
        injecting there would overwrite known-clean NaN values. Documented
        intentional removals (indices 0-3) are excluded from the completeness
        missingness rate via check_e4(..., intentional_removals_by_mod).
      RespiBAN_ECG: >
        Drop complete rows to create nSeq sequence gaps. Each dropped row is a
        gap of 1 in the sequence counter. Note: dropping rows affects all 8
        RespiBAN channels, not ECG alone -- this is an inherent property of the
        sequence-gap completeness mechanism and is documented here as a
        pre-registered design choice.

  completeness_contiguous_dropout:
    description: >
      A single contiguous block of NaN values (simulating a sensor dropout
      segment) injected at a randomly chosen starting position.
    target_signals:
      - E4/TEMP
      - E4/EDA
      - E4/HR
      - RespiBAN/ECG
    target_check: completeness
    implementation_notes:
      E4_signals: >
        Replace a consecutive block of rows with "nan". Block start chosen
        uniformly at random; all rows in the block are set to NaN.
        For E4/TEMP: block must not overlap indices 0-3 (already NaN in Silver
        TEMP; see injection_source).
      RespiBAN_ECG: >
        Drop a contiguous block of rows to create a single gap of n_faults in
        the nSeq counter.

  conformance_non_numeric:
    description: >
      Non-parseable string values injected into numeric fields. The string
      "FAULT" is used so injected cells are unambiguously identifiable.
    target_signals:
      - E4/TEMP
      - E4/EDA
      - E4/HR
      - RespiBAN/ECG
    target_check: conformance
    fault_value: "FAULT"
    implementation_notes:
      E4_signals: >
        Replace data row values with the string "FAULT". Positions chosen
        uniformly at random without replacement.
      RespiBAN_ECG: >
        Replace CH1 (ECG column) values with "FAULT" at randomly chosen rows.
        Other columns are unchanged.

  conformance_out_of_device_range:
    description: >
      Values outside the device output range. For E4 signals the conformance
      and plausibility range bounds are identical (see e4_bounds_overlap_note),
      so E4 out-of-range testing is replaced by conformance_sampling_rate_fault.
      Only RespiBAN ECG is tested here (ADC range is distinct from the
      plausibility physical-unit bound after the ECG transfer function).
    target_signals:
      - RespiBAN/ECG
    target_check: conformance
    fault_values:
      RespiBAN_ECG: 70000
    fault_value_rationale:
      RespiBAN_ECG: >
        70000 is above the 16-bit ADC maximum of 65535. After applying the ECG
        transfer function: (70000/65536 - 0.5) * 3 = 1.70 mV, which exceeds the
        plausibility bound of 1.5 mV. Detected by conformance (ADC range) and
        also by plausibility (mV range after transfer function).

  conformance_sampling_rate_fault:
    description: >
      The declared sampling rate in row 1 of an E4 EDA CSV header is replaced
      with a wrong value (4 Hz declared as 8 Hz). This is a file-level
      structural fault: the conformance check either detects the mismatch or
      it does not. No severity loop is applied; each participant yields one
      record (detected: true/false).
    target_signals:
      - E4/EDA
    target_check: conformance
    fault_value:
      E4_EDA_injected_hz: 8.0
      E4_EDA_expected_hz: 4.0
    fault_value_rationale:
      E4_EDA: >
        EDA is declared at 4 Hz in the WESAD dataset. Setting row 1 of EDA.csv
        to 8.0 makes _check_e4_modality compare 8.0 against the expected 4.0
        and record sampling_rate.ok = False. This tests a conformance mechanism
        (declared-rate verification) that is independent of the physiological
        range bounds shared by conformance and plausibility.

  plausibility_physiological_impossible:
    description: >
      Physiologically impossible values that are within the device output range
      (the device can physically produce these values but they are clinically
      implausible). Fault values are fixed per signal across all severities and
      participants.
    target_signals:
      - E4/TEMP
      - E4/HR
      - E4/EDA
    target_check: plausibility
    fault_values:
      E4_TEMP: 50.0
      E4_HR: 300.0
      E4_EDA: -1.0
    fault_value_rationale:
      E4_TEMP: >
        50 deg C: above the 42 deg C plausibility bound. The E4 can output this
        (warm-up artifact shows device reaches ~382 deg C). Physiologically
        impossible for resting wrist skin temperature. Cross-check: conformance
        also detects (same 42 deg C bound).
      E4_HR: >
        300 bpm: above the 250 bpm plausibility bound. The E4 HR algorithm could
        theoretically output this if it detects motion artefacts as heartbeats.
        Physiologically impossible for sustained human HR. Cross-check:
        conformance also detects (same 250 bpm bound).
      E4_EDA: >
        -1.0 microsiemens: below the 0 microsiemens plausibility bound (EDA is
        always non-negative). Breach class is physiological_implausible (below
        min). Cross-check: conformance also detects (same 0 min bound).
    implementation_notes:
      E4_TEMP: >
        Exclude indices 0-3 (pre-existing warm-up violations at those positions).

  timeliness_start_shift:
    description: >
      The start timestamp of the E4 EDA channel is shifted by a fixed offset.
      E4 EDA is the reference modality used by the alignment detector (preferred
      at 4 Hz per _E4_REF_PRIORITY in src/alignment.py). Shifting its start time
      is equivalent to claiming the E4 started earlier or later than it did.
    target_signals:
      - E4/EDA
    target_check: timeliness
    offsets_seconds: [0.5, 2.0, 10.0, 60.0, 3600.0]
    offset_rationale:
      0.5: Within the 1.0 s threshold -- expected to pass even if detected.
      2.0: Above the 1.0 s threshold -- would flip verdict if detected.
      10.0: Large offset well above threshold.
      60.0: One minute; simulates a systematic recording startup error.
      3600.0: One hour; simulates a timezone conversion error (UTC vs UTC+1).
    implementation_note: >
      The E4 EDA start time is stored in row 0 of EDA.csv (a Unix timestamp).
      The harness adds offset_s to this value. All other E4 files and the
      RespiBAN file are copied unchanged.
    alignment_harness_note: >
      src/alignment._align_participant() hardcodes BRONZE = Path("bronze/WESAD")
      at module level and cannot be redirected to a scratch directory. The harness
      therefore calls the internal helper functions _e4_modality_info,
      _respiban_info, and _measure_overlap_offsets from src/alignment.py directly.
      These functions accept path arguments and are not modified. This is not a
      modification of any check -- it is calling sub-functions at a level below
      the main orchestrator.

e4_bounds_overlap_note: >
  For E4 signals (EDA, skin_temperature/TEMP, heart_rate/HR), the conformance
  range check and the plausibility check use the same numerical bounds, both
  sourced from config/physiological_ranges.yaml. An out-of-range fault for an
  E4 signal therefore triggers both checks simultaneously: it is impossible to
  test E4 conformance range detection independently of plausibility using a
  value-based fault. This overlap is a design observation about the pipeline
  architecture. It is the reason the E4 out-of-range conformance fault was
  replaced with conformance_sampling_rate_fault, which tests a check mechanism
  (declared-rate verification) that has no equivalent in plausibility. The
  overlap does not affect RespiBAN ECG: ADC range (conformance) and
  physical-unit range after ECG transfer function (plausibility) are
  numerically distinct bounds.

# ---------------------------------------------------------------------------
# Control condition
# ---------------------------------------------------------------------------

control_condition:
  description: >
    Severity-zero baseline: no faults are injected. The cleaned state (Silver
    TEMP + Bronze for all other signals) is passed through all checks unchanged.
    Pre-registered expectation: zero flags from every check and a passing
    verdict for every signal.
  participants: [S2, S8, S15]
  checks: [completeness, conformance, plausibility, timeliness]
  pre_registered_expectation:
    all_checks_all_signals:
      verdict_level: per_signal
      n_flags: 0
      verdict: pass
      reasoning: >
        The effective cleaned dataset (Silver TEMP + Bronze) has been verified
        against all checks in the post-cleaning analysis (see
        reports/wesad_completeness_post_cleaning.json,
        wesad_conformance_post_cleaning.json,
        wesad_plausibility_post_cleaning.json). Silver TEMP has NaN at indices
        0-3: completeness excludes them via intentional_removals_by_mod;
        plausibility skips them via dropna; conformance treats them as
        genuinely empty (not non-numeric violations). All other signals are
        unchanged Bronze with zero violations. The control condition is expected
        to reproduce these post-cleaning results for S2, S8, and S15.

# ---------------------------------------------------------------------------
# Severities
# ---------------------------------------------------------------------------

severities:
  sample_level_fractions: [0.001, 0.01, 0.05, 0.10]
  labels: ["0.1%", "1%", "5%", "10%"]
  note: >
    Applied to completeness, conformance, and plausibility experiments.
    n_faults = max(1, int(n_samples * severity)).
    Timeliness uses fixed offsets_seconds instead (no severity dimension).

# ---------------------------------------------------------------------------
# Random seeds
# ---------------------------------------------------------------------------

random_seeds:
  base_seed: 12345
  derivation: >
    seed = base_seed + participant_index * 1000 + fault_type_index * 100
    + severity_index * 10
  participants_order: [S2, S8, S15]
  fault_types_order:
    - completeness_scattered_nan
    - completeness_contiguous_dropout
    - conformance_non_numeric
    - conformance_sampling_rate_fault
    - plausibility_physiological_impossible
    - timeliness_start_shift
  note: >
    Seeds are fully specified here so any rerun produces identical injected
    positions. numpy.random.default_rng(seed) is used throughout.

# ---------------------------------------------------------------------------
# Metrics
# ---------------------------------------------------------------------------

metrics:
  detection_rate:
    definition: >
      (number of injected fault positions flagged by the intended check) divided
      by (number of faults injected). A fault is "flagged" when the check reports
      a violation at that exact position (for per-sample metrics) or when the
      aggregate violation count increases by at least the injected count.
  false_positive_count:
    definition: >
      Violations reported by the check at positions that were NOT injected and
      that were not pre-existing in the clean copy. Pre-existing violations
      (e.g. E4 TEMP warm-up artifact at indices 0-3) are not counted as false
      positives.
  cross_check_detections:
    definition: >
      Whether a fault injected for one check dimension is also flagged by a
      different check dimension. Recorded as a dict {dimension: detected} for
      each experiment record.
  verdict_flip:
    definition: >
      Whether the check's passes_threshold verdict changes from True (clean
      copy) to False (corrupted copy). Recorded as a boolean per experiment.

# ---------------------------------------------------------------------------
# Pre-registered expectations
# ---------------------------------------------------------------------------
# Stated before any experiment is run. Expectations are per fault_type and
# severity. "detection_rate" and "verdict_flip" predictions are the primary
# commitments; "cross_check_detections" and "false_positive_count" are
# secondary observations.

pre_registered_expectations:

  completeness_scattered_nan:
    verdict_level: per_signal
    all_signals:
      all_severities:
        detection_rate: 1.0
        verdict_flip: true
        false_positive_count: 0
        reasoning: >
          The completeness threshold is 0.0 (any missingness fails). Every
          injected NaN is counted in n_nan / total_cells. The cleaned baseline
          (Silver TEMP + Bronze) has zero NaN after excluding the intentional
          TEMP removals at indices 0-3. Any injected NaN at non-excluded
          positions shifts missingness_rate above zero and flips the verdict.
          For RespiBAN ECG: each dropped row creates one nSeq gap; the
          sequence_gap_missingness_rate becomes total_dropped / expected_n
          which is positive for any n_gaps >= 1.

  completeness_contiguous_dropout:
    verdict_level: per_signal
    all_signals:
      all_severities:
        detection_rate: 1.0
        verdict_flip: true
        false_positive_count: 0
        reasoning: >
          Same reasoning as completeness_scattered_nan. A contiguous block of
          NaN values contributes the same total NaN count to missingness_rate.

  conformance_non_numeric:
    verdict_level: per_signal
    all_signals:
      all_severities:
        detection_rate: 1.0
        verdict_flip: true
        false_positive_count: 0
        reasoning: >
          The conformance threshold is 0.0. Every "FAULT" string is
          non-parseable by pd.to_numeric and is counted in n_non_numeric.
          n_non_numeric > 0 causes non_numeric.ok = False. The baseline
          has zero non-numeric violations.

  conformance_sampling_rate_fault:
    verdict_level: per_signal
    E4_EDA:
      severity: null
      detected: true
      verdict_flip: true
      reasoning: >
        The conformance check reads row 1 of EDA.csv as the declared sampling
        rate and compares to the expected 4.0 Hz. Injecting 8.0 Hz causes
        _check_e4_modality to set sampling_rate.ok = False and append a
        sampling violation to the aggregate. Baseline EDA.csv has 4.0 Hz
        declared, so baseline_sampling_rate_ok = True. After injection,
        sampling_rate.ok = False. verdict_flip = True.

  conformance_out_of_device_range:
    verdict_level: per_signal
    RespiBAN_ECG:
      all_severities:
        detection_rate: 1.0
        verdict_flip: true
        false_positive_count: 0
        cross_check_plausibility: true
        reasoning: >
          ADC value 70000 exceeds the 16-bit ceiling of 65535. Conformance
          flags it via ADC range check. Plausibility also flags it because
          the ECG transfer function maps 70000 to approximately 1.70 mV,
          which exceeds the 1.5 mV plausibility bound.

  plausibility_physiological_impossible:
    verdict_level: per_signal
    E4_TEMP:
      severity_0.1pct:
        verdict_flip: false
        detection_rate: 1.0
        cross_check_conformance: true
        reasoning: >
          Silver TEMP has NaN at indices 0-3 (excluded by dropna before the
          plausibility range check); no pre-existing violations. At 0.1%
          severity: nf = max(1, int(N*0.001)). Rate = nf/(N-4). For typical
          WESAD E4 TEMP session lengths (N ~7000-27000), rate is approximately
          0.001, well below the 0.01 threshold. Verdict does not flip.
      severity_1pct:
        verdict_flip: session_length_dependent
        detection_rate: 1.0
        cross_check_conformance: true
        reasoning: >
          At 1% severity: nf = int(N*0.01) injected values; valid sample count
          after dropna is (N-4). Rate = int(N*0.01)/(N-4). For large N this
          equals approximately 0.01*N/(N-4), which is slightly above 0.01.
          Whether the verdict flips depends on the exact session length and
          floor rounding. Pre-registered as session_length_dependent; exact
          result is an observation.
      severity_5pct_and_10pct:
        verdict_flip: true
        detection_rate: 1.0
        cross_check_conformance: true
    E4_EDA:
      severity_0.1pct:
        verdict_flip: false
        detection_rate: 1.0
        cross_check_conformance: true
        reasoning: >
          No pre-existing violations. At 0.1% of N_EDA samples: nf ~ 0.001*N.
          Rate ~ 0.001 < 0.01 threshold. Verdict does not flip.
      severity_1pct:
        verdict_flip: false
        detection_rate: 1.0
        cross_check_conformance: true
        reasoning: >
          At 1% of N_EDA samples: nf = int(N*0.01). Rate = nf/N exactly at
          threshold (passes_threshold = rate <= threshold = True). No flip.
      severity_5pct:
        verdict_flip: true
        detection_rate: 1.0
        cross_check_conformance: true
      severity_10pct:
        verdict_flip: true
        detection_rate: 1.0
        cross_check_conformance: true
    E4_HR:
      severity_0.1pct:
        verdict_flip: false
        detection_rate: 1.0
        cross_check_conformance: true
        reasoning: >
          No pre-existing violations. At 0.1% of ~1800 samples: nf = 1 or 2.
          Rate < 0.01. No flip.
      severity_1pct:
        verdict_flip: false
        detection_rate: 1.0
        cross_check_conformance: true
        reasoning: >
          At 1% of ~1800 samples: nf ~ 18. Rate ~ 0.01 exactly at threshold.
          passes_threshold = (rate <= threshold) = True. No flip.
      severity_5pct:
        verdict_flip: true
        detection_rate: 1.0
        cross_check_conformance: true
      severity_10pct:
        verdict_flip: true
        detection_rate: 1.0
        cross_check_conformance: true

  timeliness_start_shift:
    verdict_level: per_signal
    all_offsets_including_3600s:
      detection_rate: 0.0
      verdict_flip: false
      reasoning: >
        The alignment detector (src/alignment._measure_overlap_offsets) measures
        the within-overlap residual by reconstructing each sensor's sample grid
        from its own start timestamp. When E4 EDA's start timestamp is shifted
        by offset_s, the E4 sample grid shifts by the same amount. The overlap
        window also shifts to compensate. At each of the five evaluation points,
        the reconstructed E4 time and the reconstructed RespiBAN time both track
        the true wall clock within their respective quantization bounds. The
        measured offset_s at each point is bounded by the E4 EDA quantization
        noise (~0.125 s at 4 Hz) regardless of the injected shift. The detector
        cannot distinguish a correctly synchronized recording from one where the
        E4 start time has been shifted. This is a documented limitation of the
        timestamp-anchoring method: it verifies internal consistency of each
        sensor's own timeline but cannot detect a uniform shift applied to one
        sensor's recorded start time. The 3600 s offset simulates a timezone
        error (e.g. UTC vs UTC+1) and is included specifically to confirm this
        limitation holds even for large shifts.
      measured_residual_expected: "bounded by ~0.126 s (E4 EDA quantization noise at 4 Hz)"
