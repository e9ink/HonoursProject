# Pre-registered thresholds for each quality dimension, blank and pending sign-off.
# Grounded in Batini et al. (2009) and Wang & Strong (1996).
# Provided by Kevin; never edited by automated pipeline code.
# Accuracy is intentionally absent (no metric defined in the source document).
#
# GATE: Tasks 5 (plausibility check) and 11 (quality report) must refuse to run
# until meta.signed_off is true. The pipeline reads this flag before executing
# any CCP check or before/after comparison.

meta:
  locked: false
  signed_off: false
  signed_off_by:
  date_locked:

completeness:
  max_missingness_rate:            # Maximum acceptable proportion of absent samples per modality (0.0–1.0)

validity:
  # Both conformance (format/range/sampling rules) and plausibility
  # (physiological bounds) map to validity in the document's framework.
  max_conformance_violation_rate:  # Maximum acceptable proportion of format/range/sampling violations (0.0–1.0)
  max_plausibility_failure_rate:   # Maximum acceptable proportion of values outside physiological bounds (0.0–1.0)

timeliness:
  max_cross_modal_offset_seconds:  # Maximum acceptable mean timestamp offset across modalities after alignment (seconds)

consistency:
  # No dedicated metric is defined for consistency in the source document.
  # Conformance and plausibility are both assigned to validity above.
  # Flagged for Kevin: confirm whether a consistency metric (e.g. internal
  # contradictions between signals or repeated-measure agreement) should be
  # added, or whether this dimension is intentionally unmeasured in this project.
