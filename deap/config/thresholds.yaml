meta:
  signed_off: true
  signed_off_by: Kevin Hudoyo
  note: "approved by supervisor (Dr Tobias Cibis) 2026-11-18"
  date: "2026-11-17"

# NOTE: These rules were defined after Bronze profiling (unlike the WESAD rules,
# which were set before any check ran). The profiling results informed which checks
# are applicable and which must be deferred.

completeness:
  max_nan_count: 0
  max_inf_count: 0
  justification: >
    No unintended missingness expected in preprocessed DEAP data.
    Bronze profiling confirmed 0 NaNs and 0 Infs across all 32 participants
    and all 40 channels.

conformance:
  expected_data_shape: [40, 40, 8064]
  expected_labels_shape: [40, 4]
  expected_dtype: "float64"
  max_violations: 0
  justification: >
    DEAP preprocessed format: 40 trials x 40 channels x 8064 samples.
    Koelstra et al. (2012): 32 participants, 40 one-minute music video trials,
    32 EEG + 8 peripheral channels. 8064 samples per trial. The paper documents
    a 60-second stimulus; at 128 Hz, 8064 samples span 63 s. Neither the
    sampling rate of the released files nor the composition of the extra 3 s
    is documented in sources held (the paper describes downsampling to 256 Hz
    for its own analysis, not for the released files). Labels shape (40, 4): valence, arousal, dominance, liking.

label_plausibility:
  min_label_value: 1.0
  max_label_value: 9.0
  max_out_of_range: 0
  justification: >
    SAM 1-9 scale. Koelstra et al. (2012), p. 23: "numbers 1-9 printed below"
    the self-assessment manikins. Participants could click anywhere below or
    in between numbers, making this a continuous scale within [1, 9].

consistency_structure:
  max_mismatches: 0
  justification: >
    All participants must have identical array shapes (40, 40, 8064) and
    (40, 4), identical channel count (40), and identical trial count (40).

consistency_cross_source:
  tolerance: 1.0e-4
  max_mismatches: 0
  justification: >
    Labels in .dat files must match participant_ratings.xls.
    Matching: dat labels[i] corresponds to XLS row with Experiment_id == i+1
    (trials in Experiment_id order, confirmed by EDA_DEAP.ipynb notebook and
    label audit).

# NOT APPLIED -- recorded for transparency
# 2026-11-18: explanatory wording corrected to remove unsourced claims; no rule or threshold changed.
physiological_plausibility:
  applied: false
  reason: >
    Peripheral channel units and preprocessing in the preprocessed release are
    not documented in available sources. GSR has negative values across
    participants; Koelstra et al. (2012, p. 27) describe GSR detrending for
    their own analysis, but whether this applies to the released files is not
    stated. Temp channel range differs markedly across participants
    (Group A, s01-s23 and s25: range under 10 per participant; Group B, s24
    and s26-s32: range over 500 per participant); cause of the split is
    undocumented. Resp and BVP units are not stated in the paper.

# NOT APPLICABLE
timeliness:
  applied: false
  reason: >
    All 40 channels share a single sample clock per participant. No cross-device
    temporal alignment is needed.
